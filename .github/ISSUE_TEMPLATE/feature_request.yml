name: Feature request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I read the non-goals in [ROADMAP.md](https://github.com/Alexays/Lilo/blob/master/ROADMAP.md) and this request does not fall under them
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Who benefits from it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like. Be as specific as possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about and why you ruled them out.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or other context.
    validations:
      required: false
