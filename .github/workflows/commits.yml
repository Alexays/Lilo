name: Commit messages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Each push run checks only its own range, so a push run must never be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # A title or body edit only needs the validator, not the history.
          fetch-depth: ${{ github.event.action == 'edited' && !github.event.changes.base && 1 || 0 }}
      - if: github.event.action != 'edited'
        run: make hooks-test
      - name: Check commit messages
        if: github.event.action != 'edited' || github.event.changes.base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # A force-push leaves the previous tip out of the clone: check the whole history then.
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=0000000000000000000000000000000000000000
          BASE=$BASE make lint-commits
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | make lint-commit-message
      - name: Check release notes
        if: github.event_name == 'pull_request' && github.event.action != 'edited'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha }}
        # A warning, not a failure: tests, documentation and build tooling need no note.
        run: |
          changed=$(git diff --name-only "$BASE...$COMMIT_HEAD")
          if printf '%s\n' "$changed" | grep -qE '^(Lilo|lilo-ui/src)/' \
            && ! printf '%s\n' "$changed" | grep -qE '^\.changes/unreleased/.+\.yaml$'; then
            echo "::warning::This pull request changes the app without a release note: run make change if people using Lilo will notice it."
          fi
