name: Commit messages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Each push run checks only its own range: one group per pushed commit, so a newer push never
# replaces a pending one. A pull request keeps one group, its newest run being the one that counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Conventional Commits
    # A squash-merged PR's fork head may no longer be present in the checkout.
    if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every event checks the commits too: an edit's run is the PR's latest result, and the one that
      # cancels an earlier run still going.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: make hooks-test
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # A force-push leaves the previous tip out of the clone: check the whole history then.
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=0000000000000000000000000000000000000000
          BASE=$BASE make lint-commits
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | make lint-commit-message
      - name: Check release notes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha }}
        # A warning, not a failure: tests, documentation and build tooling need no note.
        run: |
          changed=$(git diff --name-only "$BASE...$COMMIT_HEAD")
          if printf '%s\n' "$changed" | grep -qE '^(Lilo|lilo-ui/src)/' \
            && ! printf '%s\n' "$changed" | grep -qE '^\.changes/unreleased/.+\.yaml$'; then
            echo "::warning::This pull request changes the app without a release note: run make change if people using Lilo will notice it."
          fi
