name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make release-status release-test site-generate
      - name: Check website metadata matches the app version
        run: git diff --exit-code site/public

  ui:
    name: UI (lint, test, build, end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: lilo-ui/package-lock.json
      - run: make validate-ui
      - run: npx playwright install --with-deps chromium
        working-directory: lilo-ui
      - run: make e2e
      - name: List tests that passed only on a retry
        if: always()
        run: python3 scripts/retried_tests.py lilo-ui/test-results/report.json >> "$GITHUB_STEP_SUMMARY"
      # A retried test leaves its trace there too, failing the run or not.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-traces
          path: lilo-ui/test-results/
          if-no-files-found: ignore

  bridge:
    name: Extension Bridge Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: Lilo/Extensions/bridge-src/package-lock.json
      - run: make ext-bridge-test
      - name: Check generated bridge bundles match bridge-src
        run: |
          make ext-bridge-build
          git diff --exit-code \
            Lilo/Extensions/ChromeAPIAugmentation.js \
            Lilo/Extensions/ChromeAPIBackgroundPrelude.js \
            Lilo/Extensions/ChromeContentCompat.js \
            Lilo/Extensions/ChromeStaticRules.js \
            Lilo/Extensions/ChromeWebStoreShim.js \
            || (echo "::error::Extension bridge bundles are out of sync with bridge-src: run 'make ext-bridge-build' and commit." && exit 1)

  app:
    name: App Validate + Swift Tests (macOS)
    # The macOS 27 image whose default Xcode is 27 (the SDK Lilo builds against); macos-26 only has Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: lilo-ui/package-lock.json
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: brew install swiftlint xcodegen
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived.noindex/xcode/SourcePackages
          key: spm-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Check Lilo.xcodeproj matches project.yml
        run: |
          make project-sync
          git diff --exit-code Lilo.xcodeproj \
            || (echo "::error::Lilo.xcodeproj is out of sync with project.yml - run 'make project-sync' and commit." && exit 1)
      - run: make swiftlint xcode-build xcode-build-release
      - run: make swift-test RESULT_BUNDLE=build/swift-test.xcresult
      - run: make swift-test-slow RESULT_BUNDLE=build/swift-test-slow.xcresult
      - name: List tests that passed only on a retry
        if: always()
        run: python3 scripts/retried_tests.py build/swift-test.xcresult build/swift-test-slow.xcresult >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: swift-test-results
          path: build/*.xcresult
          if-no-files-found: ignore

  startup-bench:
    name: Startup Benchmark (macOS, informational)
    needs: app
    runs-on: xcode-27
    timeout-minutes: 45
    # Launch times drift with the runner: the numbers are kept per commit, never gate a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: lilo-ui/package-lock.json
      - run: xcodebuild -downloadComponent MetalToolchain
      - name: Run startup benchmark
        shell: bash
        run: |
          mkdir -p build/startup-bench
          make startup-bench RUNS=5 TABS=10 OUT=build/startup-bench | tee build/startup-bench/summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: startup-bench-${{ github.sha }}
          path: build/startup-bench/
          if-no-files-found: ignore
