name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A push to main keeps its own run, so every merged commit gets a result; a pull request's newer push
# cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Documentation and release notes alone skip the builds, which then count as passed. COMPATIBILITY.md
      # is a test input; a range git cannot read (a force-push) runs everything.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            printf '%s\n' "$files" | grep -qvE '^(docs/|\.changes/)|\.md$' \
              || printf '%s\n' "$files" | grep -qx COMPATIBILITY.md || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  release-tooling:
    name: Release tooling and website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'site/.nvmrc'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - run: make release-status release-test site-check site-test site-deploy-check

  ui:
    name: UI (lint, test, build, end-to-end)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: lilo-ui/package-lock.json
      - run: make validate-ui
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('lilo-ui/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: lilo-ui
      - run: make e2e
      - name: List tests that passed only on a retry
        if: always()
        run: python3 scripts/retried_tests.py lilo-ui/test-results/report.json >> "$GITHUB_STEP_SUMMARY"
      # A retried test leaves its trace there too, failing the run or not.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-traces
          path: lilo-ui/test-results/
          if-no-files-found: ignore

  bridge:
    name: Extension Bridge Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: Lilo/Extensions/bridge-src/package-lock.json
      - run: make ext-bridge-test
      # Untracked files count too: a new bundle never committed is out of sync as well.
      - name: Check generated bridge bundles match bridge-src
        run: |
          make ext-bridge-build
          test -z "$(git status --porcelain --untracked-files=all Lilo/Extensions)" \
            || { git status --short Lilo/Extensions; echo "::error::Extension bridge bundles are out of sync with bridge-src: run 'make ext-bridge-build' and commit."; exit 1; }

  app:
    name: App Validate + Swift Tests (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The macOS 27 image whose default Xcode is 27 (the SDK Lilo builds against); macos-26 only has Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: lilo-ui/package-lock.json
      - run: xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived.noindex/xcode/SourcePackages
          key: spm-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Check Lilo.xcodeproj matches project.yml
        run: |
          make project-sync
          test -z "$(git status --porcelain --untracked-files=all Lilo.xcodeproj)" \
            || { git status --short Lilo.xcodeproj; echo "::error::Lilo.xcodeproj is out of sync with project.yml: run 'make project-sync' and commit."; exit 1; }
      # A checkout dates every file now, which would make Xcode rebuild all of a cached build: unchanged files keep the
      # date of their content, and XCBuild ignores the new inodes.
      - name: Date files by their content
        run: |
          git ls-files -s -z | python3 scripts/pin_mtimes.py
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      # Debug build products of the last main build: a run rebuilds only what changed since. Saved from main only.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .derived.noindex/xcode
            !.derived.noindex/xcode/SourcePackages
            !.derived.noindex/xcode/Logs
          key: deriveddata-debug-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: deriveddata-debug-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      - run: make swiftlint
      # swift-test builds Debug itself.
      - run: make swift-test RESULT_BUNDLE=build/swift-test.xcresult
      - run: make swift-test-slow RESULT_BUNDLE=build/swift-test-slow.xcresult
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            .derived.noindex/xcode
            !.derived.noindex/xcode/SourcePackages
            !.derived.noindex/xcode/Logs
          key: deriveddata-debug-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
      - name: List tests that passed only on a retry
        id: retried
        if: always()
        run: |
          mkdir -p build
          python3 scripts/retried_tests.py build/swift-test.xcresult build/swift-test-slow.xcresult > build/retried.md
          cat build/retried.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s build/retried.md ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      # Also kept for a test that passed on its retry, so its first failure can be looked into.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || steps.retried.outputs.any == 'true'
        with:
          name: swift-test-results
          path: build/*.xcresult
          if-no-files-found: ignore

  # Beside the tests rather than before them: a Release-only build error still fails the run. It is release.yml's
  # build, ad-hoc signed for want of secrets (signing compiles nothing), so a release tag finds it built.
  release-build:
    name: Release Build (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -downloadComponent MetalToolchain
      # Same key as release.yml's, which restores it.
      - name: Hash the UI lockfile
        id: ui-lock
        run: echo "hash=$(grep -v '"version":' lilo-ui/package-lock.json | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the UI build
        id: ui-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Lilo/Generated/ChromeUIAssets.swift
            Lilo/Generated/NativeStrings.swift
          key: ui-${{ steps.ui-lock.outputs.hash }}-${{ hashFiles('lilo-ui/src/**', 'lilo-ui/index.html', 'lilo-ui/svelte.config.js', 'lilo-ui/tsconfig.json', 'lilo-ui/vite.config.ts', 'scripts/embed_chrome_ui.py', 'scripts/generate_native_strings.py') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ui-cache.outputs.cache-hit != 'true'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: lilo-ui/package-lock.json
      # As release.yml builds it: no install script runs.
      - name: Build the UI
        if: steps.ui-cache.outputs.cache-hit != 'true'
        run: |
          npm --prefix lilo-ui ci --ignore-scripts
          make ui-build
      - name: Date files by their content
        run: |
          { git ls-files -s -z
            for f in Lilo/Generated/ChromeUIAssets.swift Lilo/Generated/NativeStrings.swift; do
              printf '100644 %s 0\t%s\0' "$(git hash-object "$f")" "$f"
            done; } | python3 scripts/pin_mtimes.py
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .derived.noindex/build-app
            !.derived.noindex/build-app/Logs
          key: deriveddata-release-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: deriveddata-release-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      - run: make release-archive
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            .derived.noindex/build-app
            !.derived.noindex/build-app/Logs
          key: deriveddata-release-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
      # Launches of the app just built, kept per merged commit. They drift with the runner, so they never fail the run.
      # Re-signed without the hardened runtime, whose library validation rejects the ad-hoc signed Sparkle.framework.
      - name: Run startup benchmark
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          codesign --force --deep --sign - --preserve-metadata=entitlements build/release/export/Lilo.app
          mkdir -p build/startup-bench
          make startup-bench RUNS=5 TABS=10 OUT=build/startup-bench APP=build/release/export/Lilo.app | tee build/startup-bench/summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && always()
        with:
          name: startup-bench-${{ github.sha }}
          path: build/startup-bench/
          if-no-files-found: ignore
