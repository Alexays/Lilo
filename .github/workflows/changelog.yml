# Films the highlights of a changelog entry drafted on a changelog/<version> branch and commits
# them to it. A highlight this cannot film stays text-only.

name: Changelog media

on:
  push:
    branches: ['changelog/*']
    paths: ['release-media/plans/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  media:
    if: github.repository == 'Alexays/Lilo' && startsWith(github.ref_name, 'changelog/')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Install the tools
        run: |
          xcodebuild -downloadComponent MetalToolchain
          brew install ffmpeg
          npm --prefix lilo-ui ci --ignore-scripts
      - name: Film the highlights
        run: |
          version="${GITHUB_REF_NAME#changelog/}"
          [ -d "release-media/plans/$version" ] || exit 0
          make vt-build ui-build
          make changelog-media RELEASE="$version"
      - name: Add them to the branch
        run: |
          version="${GITHUB_REF_NAME#changelog/}"
          git add release-media/assets site/src/content/releases lilo-ui/src/components/whatsnew/releaseHighlights.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(changelog): film the $version highlights"
          git push
