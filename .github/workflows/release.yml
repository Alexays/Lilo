# Release workflow: builds, signs, notarizes, and uploads a DMG to GitHub Releases.
# Maintainer-only: it runs on v* tags of Alexays/Lilo, never in forks, and needs these secrets:
#   APPLE_CERT              - base64-encoded .p12 Developer ID certificate
#   APPLE_CERT_PASSWORD     - password for the .p12
#   APPLE_NOTARY_TEAM_ID    - Apple Developer team ID (also used as DEVELOPMENT_TEAM)
#   APPLE_NOTARY_APPLE_ID   - Apple ID for notarytool
#   APPLE_NOTARY_PASSWORD   - app-specific password for notarytool
#   SPARKLE_ED_PRIVATE_KEY  - Sparkle EdDSA private key (generate_keys -x) that signs the appcast
#   CLOUDFLARE_API_TOKEN    - scoped Workers deployment token for lilo-site
#   CLOUDFLARE_ACCOUNT_ID   - Cloudflare account that owns getlilo.app

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-notarization.
  cancel-in-progress: false

jobs:
  release-media:
    name: Native release media
    if: github.repository == 'Alexays/Lilo'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Check the tag is a prepared release
        run: make release-tag-check TAG="$GITHUB_REF_NAME"
      - name: Install native capture and video tools
        run: |
          xcodebuild -downloadComponent MetalToolchain
          brew install ffmpeg
      - name: Capture, author, render and check the release
        run: make release-media-ci RELEASE="${GITHUB_REF_NAME#v}"
      - name: Build the website from the same verified media
        run: make site-generate
      # Data only: the signing job runs its own checkout's scripts, never ones this secretless job could have rewritten.
      - name: Preserve the verified native and website inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-media-${{ github.sha }}
          overwrite: true
          path: |
            release-media/assets/
            release-media/public/native/
            release-media/backlog.json
            site/dist/
          if-no-files-found: error
      - name: Preserve failed capture and quality diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-media-failure-${{ github.sha }}
          path: |
            build/release-media/
            release-media/assets/
          if-no-files-found: ignore

  build-and-sign:
    needs: release-media
    if: github.repository == 'Alexays/Lilo'
    # The signing and notarization secrets live in this environment, which only v* tags may deploy to:
    # a workflow pushed on any other branch cannot read them.
    environment: release
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      # No token left in .git/config for the build's tools and dependencies to read; the upload step gets its own.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Download this run's verified native media
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-media-${{ github.sha }}
          path: .
      - name: Recheck the tag and media before signing
        run: |
          make release-tag-check TAG="$GITHUB_REF_NAME"
          make release-media-publish-check RELEASE="${GITHUB_REF_NAME#v}"

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # Native What's New must embed the just-verified media, not an earlier main build's cached bundle.
      - name: Build the UI with the verified media
        run: |
          npm --prefix lilo-ui ci --ignore-scripts
          make ui-build

      # A checkout dates every file now, which would make Xcode rebuild all of the cached build: files, the generated
      # UI sources included, keep the date of their content, and XCBuild ignores the new inodes.
      - name: Date files by their content
        run: |
          { git ls-files -s -z
            for f in Lilo/Generated/ChromeUIAssets.swift Lilo/Generated/NativeStrings.swift; do
              printf '100644 %s 0\t%s\0' "$(git hash-object "$f")" "$f"
            done; } | python3 scripts/pin_mtimes.py
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      # The Release build of build.yml's release-build job on the last main push: only what
      # changed since compiles.
      - name: Restore the last main release build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .derived.noindex/build-app
            !.derived.noindex/build-app/Logs
          key: deriveddata-release-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: deriveddata-release-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Import certificate
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERT }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 20)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERT" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # The prebuilt published by ghostty-vt.yml, checked against VT_SHA256.
      - name: Download libghostty-vt
        run: make vt-build

      # Signed with Developer ID, hardened runtime and a secure timestamp; the DMG's notarization covers it.
      - name: Build and sign
        env:
          LILO_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: make release-archive

      # Installs the pinned dmgbuild into build/ and lays out the window from scripts/dmg/.
      - name: Create DMG
        run: make dmg

      # One submission: the ticket covers the DMG and the app inside, and is stapled to the DMG.
      - name: Sign and notarize DMG
        env:
          LILO_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          LILO_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          LILO_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          codesign --sign "Developer ID Application" --timestamp build/Lilo.dmg
          xcrun notarytool submit build/Lilo.dmg --wait \
            --apple-id "$LILO_NOTARY_APPLE_ID" \
            --team-id "$LILO_TEAM_ID" \
            --password "$LILO_NOTARY_APP_PASSWORD"
          xcrun stapler staple build/Lilo.dmg

      # Gatekeeper's verdict on what users download: the stapled DMG and the app inside it.
      - name: Verify DMG
        run: |
          xcrun stapler validate build/Lilo.dmg
          spctl -a -vvv -t open --context context:primary-signature build/Lilo.dmg
          mount="$RUNNER_TEMP/lilo-dmg"
          diskutil image attach --readOnly --mountOptions nobrowse --mountPoint "$mount" build/Lilo.dmg
          spctl -a -vvv "$mount/Lilo.app"
          diskutil eject "$mount"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" build/appcast
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          trap 'rm -f "$RUNNER_TEMP/sparkle.key"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          /bin/cp -f build/Lilo.dmg build/appcast/
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/sparkle.key" \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            build/appcast

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            build/Lilo.dmg
            build/appcast/appcast.xml
            build/release/dist/Lilo-dSYMs.zip
          # The version's notes, as make release-version wrote them for this tag.
          body_path: .changes/${{ github.ref_name }}.md

      - name: Delete temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP/cert.p12"

  deploy-site:
    name: Deploy verified changelog website
    needs: [release-media, build-and-sign]
    if: github.repository == 'Alexays/Lilo'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare deployment is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Alexays must add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the release environment. See docs/RELEASING.md#cloudflare-deployment-once. The GitHub release must remain a draft until this job succeeds."
            exit 1
          fi
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'site/.nvmrc'
      - name: Download this run's verified website and media
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-media-${{ github.sha }}
          path: .
      - name: Install pinned deployment dependencies
        run: npm --prefix site ci --ignore-scripts
      - name: Recheck the tag and media
        run: |
          make release-tag-check TAG="$GITHUB_REF_NAME"
          make release-media-publish-check RELEASE="${GITHUB_REF_NAME#v}"
      - name: Deploy the verified website without rebuilding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make site-deploy-verified
