name: Native release media proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-media-proof.yml'
      - 'LiloTests/Window/ReleaseCaptureTests.swift'
      - 'LiloTests/Support/ReleaseWindowRecorder.swift'
      - 'site/captures/remotion/**'
      - 'site/package*.json'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-media-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived.noindex/xcode
          key: native-media-${{ runner.os }}-${{ github.sha }}
          restore-keys: deriveddata-debug-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      - name: Capture the real isolated native window
        run: make release-media-record SWIFT_TEST_FILTER=LiloTests/ReleaseCaptureTests/testNativeMediaSmoke OUT=build/native-media-proof
      - name: Render the genuine archived 0.8.0 presentation
        run: make release-motion-render release-motion-check OUT=build/native-media-proof/presentation-0.8.0
      - name: Check shared presentation contracts
        run: make release-motion-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-lilo-media-proof
          path: build/native-media-proof/
          if-no-files-found: warn
