# Deploys getlilo.app when a push to main changes the site, or the app version its pages quote.
# Needs these secrets:
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts: Edit and Workers Routes: Edit for the getlilo.app zone
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account that owns the lilo-site Worker

name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Xcode/Configs/Base.xcconfig'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  # A deploy finishes: the next one runs after it, with the newer commit.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy getlilo.app
    if: github.repository == 'Alexays/Lilo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
