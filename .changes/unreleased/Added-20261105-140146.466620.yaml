kind: Added
body: Three or more tabs from one site gather into a stack in the sidebar, named after what their titles share; it opens like a folder and closes all its pages at once. Group by Type puts agents and terminals in their own trays above the web pages, each foldable while still showing what needs you. Both, and a one-off sort by site or title, sit behind a new button on the divider above the open tabs.
