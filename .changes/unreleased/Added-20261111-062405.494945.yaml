body: 'A download shows in a stack of cards above the downloads button as it starts, with its progress, then waits there once finished: drag the file straight to another app or the Finder, or click to open it. Rest the pointer on the stack to fan out the last files. Downloads show a preview of the file where Quick Look has one, and drag out from anywhere on their row in the menu and on the Downloads screen'
