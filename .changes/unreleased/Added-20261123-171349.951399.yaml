kind: Added
body: 'Agents now show whether they are ready: Settings lists each agent as ready, needing a sign-in or unavailable with the reason, and offers to sign in or check again. The Ask bar keeps you off an agent that cannot start, shows the models an agent offers before the first prompt, and an agent that lists no models lets you type a model ID.'
