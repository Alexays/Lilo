body: 'Agents can read a small snapshot of Lilo itself with browser_config: its version, whether the content blocker is on, the default page zoom, and the agent''s own permission state (its profile, whether actions ask first, whether calls are logged, and the sites where actions are always allowed). It is read-only, with no way to change anything'
