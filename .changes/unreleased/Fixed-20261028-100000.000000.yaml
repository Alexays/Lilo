body: A content script runs once on a page its extension's host permission and its own matches both cover (RoEarn, RoSeal, TubeBuddy threw "Can't create duplicate variable"), the manifest an extension reads no longer lists Lilo's own content script (Lightning Autofill's options), and a content script's runtime.sendMessage and connect work detached (AdScrubber).
