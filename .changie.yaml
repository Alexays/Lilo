changesDir: .changes
unreleasedDir: unreleased
# Microseconds: notes of one kind written within a second would otherwise overwrite each other.
fragmentFileFormat: '{{.Kind}}-{{.Time.Format "20060102-150405.000000"}}'
changelogPath: CHANGELOG.md
headerPath: header.md
versionExt: md
versionFormat: '## [{{.VersionNoPrefix}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
footerFormat: '[{{.VersionNoPrefix}}]: https://github.com/Alexays/Lilo/compare/{{.PreviousVersion}}...{{.Version}}'
kinds:
  - label: Breaking
    auto: major
  - label: Added
    auto: minor
  - label: Changed
    auto: patch
  - label: Fixed
    auto: patch
newlines:
  afterChangelogHeader: 1
  beforeKind: 1
  afterKind: 1
  beforeFooterTemplate: 1
  endOfVersion: 1
